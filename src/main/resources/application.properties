# ============================================
# BANCO DE DADOS (AUTO LOCAL + RENDER)
# ============================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gestao_quadrangular}
spring.datasource.username=${DB_USERNAME:wash}
spring.datasource.password=${DB_PASSWORD:2503}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# SERVIDOR
# ============================================
server.port=${PORT:8080}
server.servlet.context-path=/

# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET:troque_essa_chave_em_producao}
jwt.expiration=86400000

# ============================================
# UPLOAD
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG

# ============================================
# FLYWAY (desative no início)
# ============================================
spring.flyway.enabled=false