# ============================================
# BANCO DE DADOS
# ============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestao_quadrangular}
spring.datasource.username=${DB_USER:wash}
spring.datasource.password=${DB_PASSWORD:2503}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# HIKARICP — CONNECTION POOL
# ============================================
# Render Starter: max 25 conexoes no PostgreSQL no total
# Manter pool pequeno para nao esgotar o banco
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=IEQ-Pool
# Valida conexao antes de usar (evita conexao morta apos inatividade)
spring.datasource.hikari.connection-test-query=SELECT 1
# Mantem conexao viva durante periodos de baixo uso
spring.datasource.hikari.keepalive-time=60000

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ATENCAO: trocar para 'validate' ou 'none' quando habilitar Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Performance: desativa scan desnecessario no startup
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
# Evita lazy-loading acidental fora de transacao
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
# Batching — agrupa INSERTs/UPDATEs (melhora escrita em lote)
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Desativa geracao de estatisticas em producao
spring.jpa.properties.hibernate.generate_statistics=false

# ============================================
# INICIALIZACAO
# ============================================
#spring.main.lazy-initialization=true

# ============================================
# SERVIDOR
# ============================================
server.port=${PORT:8080}
# Compressao HTTP — reduz tamanho das respostas JSON
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024
# Timeout de conexao
server.tomcat.connection-timeout=20000
# Render Starter tem 512MB — cada thread usa ~1MB de stack
# 200 threads estoura a memoria; 20 e suficiente para o volume atual
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# ============================================
# CACHE (Caffeine)
# ============================================
spring.cache.type=caffeine
# metricas e ranking: 5 min | aniversariantes: 1h (muda uma vez por dia)
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m

# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET:de770b0a11059b2f612bdab774be430f}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# FLYWAY
# ============================================
# TODO: habilitar Flyway e mudar ddl-auto para 'validate'
# Usar ddl-auto=update em producao e arriscado (pode corromper dados)
spring.flyway.enabled=false

# ============================================
# ACTUATOR — Health check apenas
# ============================================
management.endpoint.health.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health
management.endpoint.metrics.enabled=false
management.endpoint.env.enabled=false

# ============================================
# LOGS — reduz verbosidade em producao
# ============================================
logging.level.root=WARN
logging.level.com.gestaoigrejaemcelula=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.springframework.security=WARN

# Fuso horário
spring.jackson.time-zone=America/Bahia
server.servlet.session.tracking-modes=COOKIE
spring.jpa.hibernate.use-new-id-generator-mappings=true

JAVA_OPTS=-XX:MaxMetaspaceSize=512m