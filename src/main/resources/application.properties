# ============================================
# BANCO DE DADOS (Render + Local)
# ============================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gestao_quadrangular}
spring.datasource.driver-class-name=org.postgresql.Driver

# Username e password só serão usados no ambiente local (quando DATABASE_URL não existir)
spring.datasource.username=${DB_USER:wash}
spring.datasource.password=${DB_PASSWORD:2503}

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect explícito (ajuda bastante no Render)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# SERVIDOR (IMPORTANTE PRO RENDER)
# ============================================
server.port=${PORT:8080}
server.servlet.context-path=/api

# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET:S3CR3T_LOCAL_DEV}
jwt.expiration=86400000

# ============================================
# CORS (Local + Produção)
# ============================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================================
# UPLOAD DE ARQUIVOS
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.gestaoigrejaemcelula=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# FLYWAY
# ============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration