# ============================================
# PERFIL ATIVO
# ============================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ============================================
# BANCO DE DADOS
# ============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestao_quadrangular}
spring.datasource.username=${DB_USER:wash}
spring.datasource.password=${DB_PASSWORD:2503}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# HIKARICP — CONNECTION POOL
# ============================================
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=IEQ-Pool
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=60000

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false

# ============================================
# SERVIDOR
# ============================================
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024
server.tomcat.connection-timeout=20000
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# ============================================
# CACHE (Caffeine)
# ============================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m

# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET:de770b0a11059b2f612bdab774be430f}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# FLYWAY
# ============================================
spring.flyway.enabled=false

# ============================================
# ACTUATOR — Health, Metrics, Prometheus
# ============================================
management.endpoint.health.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.env.enabled=false

# ============================================
# LOGS — base level (perfil sobreescreve)
# ============================================
logging.level.root=WARN
logging.level.com.gestaoigrejaemcelula=INFO

# ============================================
# FUSO HORÁRIO
# ============================================
spring.jackson.time-zone=America/Bahia
server.servlet.session.tracking-modes=COOKIE
spring.jpa.hibernate.use-new-id-generator-mappings=true
