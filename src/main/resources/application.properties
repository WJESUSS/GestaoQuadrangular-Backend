# ============================================
# BANCO DE DADOS
# ============================================
# ============================================
# BANCO DE DADOS
# ============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestao_quadrangular}
spring.datasource.username=${DB_USER:wash}
spring.datasource.password=${DB_PASSWORD:2503}
spring.datasource.driver-class-name=org.postgresql.Driver
# ============================================
# JPA
# ============================================
spring.jpa.hibernate.ddl-auto=none
spring.main.lazy-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# (pode remover essa linha, o Hibernate detecta sozinho)
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# SERVIDOR
# ============================================
server.port=${PORT:8080}

# Acelera o startup
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Health check
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET:dev-secret-123456789012345678901234567890}
jwt.expiration=86400000

# ============================================
# FLYWAY
# ============================================
spring.flyway.enabled=false