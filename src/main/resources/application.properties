# ============================================
# BANCO DE DADOS
# ============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestao_quadrangular}
spring.datasource.username=${DB_USER:wash}
spring.datasource.password=${DB_PASSWORD:2503}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# HIKARICP — CONNECTION POOL
# ============================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=IEQ-Pool
# Valida conexão antes de usar (evita conexão morta)
spring.datasource.hikari.connection-test-query=SELECT 1

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Performance: desativa scan desnecessário no startup
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Evita lazy-loading acidental fora de transação
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# Batching — agrupa INSERTs/UPDATEs (melhora escrita em lote)
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Desativa geração de estatísticas em produção
spring.jpa.properties.hibernate.generate_statistics=false

# ============================================
# INICIALIZAÇÃO
# ============================================
spring.main.lazy-initialization=true

# ============================================
# SERVIDOR
# ============================================
server.port=${PORT:8080}

# Compressão HTTP — reduz tamanho das respostas JSON
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# Timeout de conexão
server.tomcat.connection-timeout=20000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# ============================================
# CACHE (Caffeine)
# ============================================
spring.cache.type=caffeine
# metricas e ranking: 5 min | aniversariantes: 1h (muda uma vez por dia)
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m

# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET:de770b0a11059b2f612bdab774be430f}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# FLYWAY
# ============================================
spring.flyway.enabled=false

# ============================================
# ACTUATOR — Health check apenas
# ============================================
management.endpoint.health.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health
# Desativa endpoints desnecessários em produção
management.endpoint.metrics.enabled=false
management.endpoint.env.enabled=false

# ============================================
# LOGS — reduz verbosidade em produção
# ============================================
logging.level.root=WARN
logging.level.com.gestaoigrejaemcelula=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.springframework.security=WARN