# Credenciais e secrets locais com fallback (nunca chegam ao Render)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestao_quadrangular}
spring.datasource.username=${DB_USER:wash}
spring.datasource.password=${DB_PASSWORD:2503}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET:dev-only-secret-nao-usar-em-prod-minimo32ch}


spring.jpa.hibernate.ddl-auto=update

# Logging verboso
logging.level.root=INFO
logging.level.com.gestaoigrejaemcelula=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Actuator completo
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers
management.endpoint.env.enabled=true
management.endpoint.metrics.enabled=true
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo