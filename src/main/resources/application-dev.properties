# Dev profile — verbose logging, full actuator
logging.level.root=INFO
logging.level.com.gestaoigrejaemcelula=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Show all actuator endpoints in dev
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers
management.endpoint.env.enabled=true
management.endpoint.metrics.enabled=true
